# Lean CI: build the obseq3 development, machine-check the axiom audit of
# the compiler-correctness theorem, and run the four test suites.
#
# The lakefile declares no `require`, so nothing is fetched (the mathlib
# entry in lake-manifest.json is inert); a from-scratch build is ~2 CPU-min.
#
# What each step guards:
#   build       every proof in Obseq3Proof type-checks
#   whitelist   scripts/axiom_whitelist.txt itself still says exactly
#               propext / Classical.choice / Quot.sound and no sorries, so
#               a red audit cannot be made green by editing the pin
#   audit       obseq3.proof.compile_correct (the CompilerInv simulation,
#               rooted at compile_correct / compile_correct_from_initial)
#               rests on propext / Classical.choice / Quot.sound only, with
#               NO sorry — scripts/axiom_whitelist.txt pins it, and the
#               audit fails on drift in either direction
#   unit        mirlite SB semantics (17) + compiler witness corpus (104);
#               any failed assertion throws, so the process exits nonzero
#   corpus      ULLBC corpus, Charon artifacts vs Miri verdicts (exit 1 on
#               any FAIL/XPASS)
#   osea        differential: mirlite and oseair must agree on every
#               program (exit 1 on any mismatch)
name: lean

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · audit · conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install elan (toolchain pinned by lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /tmp
          /tmp/elan-init -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore .lake build cache
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-

      - name: Build
        run: lake build Core Obseq3 Obseq3Proof Conformance sb_conformance

      - name: Whitelist pin (the audit's reference must not have moved)
        run: bash scripts/check_whitelist.sh

      - name: Axiom audit of compile_correct
        run: bash scripts/audit_axioms.sh

      - name: Unit suites
        run: lake exe sb_conformance --unit

      - name: Conformance corpus (Charon vs Miri)
        run: lake exe sb_conformance --manifest conformance/manifest.json --charon-dir conformance/charon

      - name: Differential (mirlite vs oseair)
        run: lake exe sb_conformance --manifest conformance/manifest.json --charon-dir conformance/charon --osea

  # The live conformance run: rebuild every input of the corpus suites from
  # the Rust sources with the PINNED tools (submodules conformance/vendor/
  # {miri,charon}), check Miri's verdict and line against the manifest,
  # require the regenerated Charon artifacts and certificates to equal the
  # committed ones, and run the corpus + differential suites on the fresh
  # artifacts (conformance/scripts/live.py).
  #
  # Everything the tools need is built by conformance/scripts/bootstrap_tools.sh
  # and cached, keyed on the two submodule commits: a cache hit makes the
  # bootstrap a no-op; a miss (a pin moved) costs one rustc download + the
  # Miri and Charon builds + two std sysroots.
  live:
    name: live conformance (pinned Miri + Charon)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Tool cache key (submodule commits + bootstrap script)
        id: pins
        run: |
          # the Miri TOOL pin (vendor/miri is a fork adding only tests on top)
          echo "miri=$(sed -n 's/^miri_commit: *//p' conformance/PIN)" >> "$GITHUB_OUTPUT"
          echo "charon=$(git rev-parse HEAD:conformance/vendor/charon)" >> "$GITHUB_OUTPUT"
          echo "charon_tc=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' conformance/vendor/charon/rust-toolchain)" >> "$GITHUB_OUTPUT"

      - name: Restore pinned tools
        uses: actions/cache@v5
        with:
          path: |
            conformance/.tools
            ~/.rustup/toolchains/miri
            ~/.rustup/toolchains/${{ steps.pins.outputs.charon_tc }}-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/${{ steps.pins.outputs.charon_tc }}-x86_64-unknown-linux-gnu
            ~/.cargo/bin/rustup-toolchain-install-master
          key: tools-${{ runner.os }}-miri-${{ steps.pins.outputs.miri }}-charon-${{ steps.pins.outputs.charon }}-${{ hashFiles('conformance/scripts/bootstrap_tools.sh') }}

      - name: Bootstrap Miri + Charon (no-op on a cache hit)
        run: bash conformance/scripts/bootstrap_tools.sh

      - name: Install elan (toolchain pinned by lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /tmp
          /tmp/elan-init -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore .lake build cache (saved by the build job)
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-

      - name: Live run (Miri + Charon from source, then both corpus suites)
        run: python3 conformance/scripts/live.py

      - name: Upload the live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report
          path: conformance/.live/report.txt
